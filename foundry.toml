[profile.default]
src = "src"
out = "out"
libs = ["lib"]
via_ir = true
optimizer = true
optimizer_runs = 200
solc_version = "0.8.28"
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]

[rpc_endpoints]
arbitrum = "${RPC_URL}"
local = "http://127.0.0.1:8545"

[etherscan]
arbitrum = { key = "${ETHERSCAN_API_KEY}" }
